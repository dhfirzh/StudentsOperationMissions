<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStart Copilot - UNITEN AI Assistant</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-box { max-height: 480px; overflow-y: auto; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-2xl bg-slate-800 rounded-xl shadow-2xl border border-slate-700 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-500 to-orange-600 p-4 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-xl text-white">DevStart Academic Copilot</h1>
                <p class="text-xs text-amber-100">UNITEN Student AI Study & Code Assistant</p>
            </div>
            <span class="text-xs bg-slate-900/40 text-amber-200 px-2.5 py-1 rounded-full font-mono">Gemini-Powered</span>
        </div>

        <!-- API Key Setup Banner -->
        <div id="api-banner" class="bg-slate-700/60 p-3 border-b border-slate-600 flex items-center gap-2 text-xs">
            <span class="text-amber-400 font-semibold">API Key:</span>
            <input type="password" id="api-key-input" placeholder="Paste Gemini API Key here..." class="bg-slate-900 text-slate-200 px-2 py-1 rounded border border-slate-600 flex-1 focus:outline-none focus:border-amber-500">
            <button onclick="saveApiKey()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1 rounded transition">Save</button>
        </div>

        <!-- Quick Prompt Shortcuts -->
        <div class="p-3 bg-slate-850 border-b border-slate-700/50 flex gap-2 overflow-x-auto text-xs">
            <button onclick="useQuickPrompt('Explain pointers in C programming like I am 10 years old.')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full whitespace-nowrap transition text-slate-300">💡 Explain C Pointers</button>
            <button onclick="useQuickPrompt('Create 3 revision flashcards for Digital Logic Gate concepts.')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full whitespace-nowrap transition text-slate-300">🎴 Digital Logic Quiz</button>
            <button onclick="useQuickPrompt('Give me a 5-step strategy to manage study time during exam week.')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full whitespace-nowrap transition text-slate-300">📅 Study Planner</button>
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="chat-box p-4 space-y-4 flex-1">
            <div class="flex items-start gap-3">
                <div class="bg-amber-500 text-slate-900 text-xs font-bold p-2 rounded-lg">AI</div>
                <div class="bg-slate-700 p-3 rounded-lg text-sm max-w-[80%] text-slate-200 leading-relaxed">
                    Hello! I am your UNITEN Academic Copilot. Ask me questions about your subjects, request code debugging, or choose a quick prompt above to get started!
                </div>
            </div>
        </div>

        <!-- Input Box -->
        <div class="p-3 bg-slate-850 border-t border-slate-700 flex gap-2">
            <input type="text" id="user-input" placeholder="Type your question or topic..." onkeydown="if(event.key==='Enter') sendMessage()" class="flex-1 bg-slate-900 text-slate-100 text-sm px-4 py-2.5 rounded-lg border border-slate-700 focus:outline-none focus:border-amber-500">
            <button onclick="sendMessage()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-5 py-2.5 rounded-lg text-sm transition">Send</button>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        let apiKey = localStorage.getItem('gemini_key') || '';
        if(apiKey) document.getElementById('api-key-input').value = apiKey;

        function saveApiKey() {
            const input = document.getElementById('api-key-input').value.trim();
            if (input) {
                apiKey = input;
                localStorage.setItem('gemini_key', input);
                alert('API Key saved to your browser!');
            }
        }

        function useQuickPrompt(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            if (!apiKey) {
                alert('Please enter your Gemini API Key in the top box first!');
                return;
            }

            const chatContainer = document.getElementById('chat-container');

            // Render User Message
            chatContainer.innerHTML += `
                <div class="flex items-start justify-end gap-3">
                    <div class="bg-amber-500/20 border border-amber-500/30 p-3 rounded-lg text-sm max-w-[80%] text-slate-100">${escapeHtml(message)}</div>
                    <div class="bg-slate-600 text-slate-200 text-xs font-bold p-2 rounded-lg">You</div>
                </div>
            `;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading state
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <div class="bg-amber-500 text-slate-900 text-xs font-bold p-2 rounded-lg">AI</div>
                    <div class="bg-slate-700 p-3 rounded-lg text-sm text-slate-400 italic">Thinking...</div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Call Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `System instruction: You are DevStart Academic Copilot, a friendly AI tutor for UNITEN students studying IT, Computer Science, and Engineering. Give structured, clear, and encouraging responses.\n\nUser Question: ${message}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `
                        <div class="flex items-start gap-3">
                            <div class="bg-amber-500 text-slate-900 text-xs font-bold p-2 rounded-lg">AI</div>
                            <div class="bg-slate-700 p-3 rounded-lg text-sm max-w-[80%] text-slate-200 leading-relaxed whitespace-pre-wrap">${escapeHtml(reply)}</div>
                        </div>
                    `;
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="bg-red-500 text-white text-xs font-bold p-2 rounded-lg">Error</div>
                        <div class="bg-red-950/50 border border-red-500/30 p-3 rounded-lg text-sm text-red-200">Failed to connect to AI. Please check your API key.</div>
                    </div>
                `;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
